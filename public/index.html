<!DOCTYPE html>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',system-ui;scroll-behavior:smooth}
body{background:#020b16;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% -10%,#0e3a66 0%,#020b16 55%);z-index:-1}

/* HEADER */
.header{width:100%;max-width:420px;display:flex;align-items:center;gap:12px;padding:18px 18px 8px;position:sticky;top:0;background:rgba(2,11,22,.8);backdrop-filter:blur(15px);z-index:10;border-bottom:1px solid rgba(42,191,255,.15)}
.icon{width:52px;height:52px;background:linear-gradient(180deg,#0a2a4a,#02121f);border:2px solid #2abfff;border-radius:16px;display:grid;place-items:center;font-size:30px;box-shadow:0 0 20px rgba(42,191,255,.6)}
.h1{font-size:26px;font-weight:900;font-style:italic;color:#7de8ff;text-shadow:0 0 15px rgba(125,232,255,.6)}
.menu{margin-left:auto;display:flex;gap:8px}
.menu a{color:#8ab0c8;text-decoration:none;font-size:12px;padding:6px 10px;border:1px solid rgba(42,191,255,.2);border-radius:20px;transition:.3s}
.menu a:hover{color:#7de8ff;border-color:#7de8ff}

.sub{width:100%;max-width:420px;text-align:center;color:#8ab0c8;font-size:14px;line-height:1.4;padding:14px 18px 18px}
.sub b{color:#5ac8ff}
.wrap{width:92%;max-width:400px}
.label{font-size:13.5px;font-weight:700;color:#d0e8ff;margin-bottom:8px;display:flex;gap:8px}
.inp{background:#071c34;border:2px solid #0f6a9a;border-radius:14px;display:flex;align-items:center;padding:0 14px;transition:.3s}
.inp:focus-within{border-color:#2abfff;box-shadow:0 0 20px rgba(42,191,255,.4)}
.inp span{font-size:22px;opacity:.5;margin-right:10px}
.inp input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;padding:14px 0}
.hint{font-size:11px;color:#5a7a9a;display:flex;gap:6px;align-items:center;margin:7px 0 18px 2px}
.hint i{width:15px;height:15px;background:#193a5a;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;color:#8ab0c8}
.btn{width:100%;padding:15px;border-radius:16px;border:2px solid #8adfff;background:linear-gradient(180deg,#e6f7ff 0%,#7dd8ff 25%,#1aaaff 55%,#0088dd 100%);color:#001a33;font-weight:900;font-size:14.5px;letter-spacing:.5px;box-shadow:0 0 30px rgba(26,170,255,.6),inset 0 1.5px 0 #fff;cursor:pointer;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:sh 2.5s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.card{margin-top:22px;background:rgba(6,22,44,.75);border:1px solid rgba(30,100,160,.4);border-radius:20px;padding:16px}
.card h3{font-size:14px;color:#5ac8ff;margin-bottom:12px;display:flex;gap:8px}
.row{display:flex;gap:12px;align-items:center;margin:11px 0}
.ic{width:40px;height:40px;min-width:40px;background:rgba(0,70,120,.25);border:1px solid rgba(42,140,200,.45);border-radius:11px;display:grid;place-items:center;font-size:16px;color:#5ac8ff}
.row b{font-size:13px;color:#d0e8ff;display:block}
.row p{font-size:11px;color:#5f7f9a}
.foot{margin-top:20px;display:flex;align-items:center;gap:10px;width:92%;max-width:400px;color:#00a0dd;font-size:11px;font-weight:800;letter-spacing:1px}
.foot .l{flex:1;height:1px;background:linear-gradient(90deg,transparent,#0a4a6a,transparent)}
#box{display:none;margin-top:16px;background:rgba(0,255,136,.07);border:1.5px solid #00ff88;border-radius:14px;padding:14px;text-align:center}
#box b{font-size:26px;letter-spacing:3px;color:#00ff88}

/* NEW SECTIONS */
.section{width:92%;max-width:400px;margin-top:28px;background:rgba(6,22,44,.6);border:1px solid rgba(30,100,160,.35);border-radius:20px;padding:18px}
.section h2{font-size:18px;color:#7de8ff;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.section p{font-size:13px;color:#8ab0c8;line-height:1.6}
